<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroAI — Gemma</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10131b;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #83b5ff;
  border-bottom: 1px solid #303746;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  width: 100%;
  max-width: 850px;
  margin: auto;
}

.message {
  padding: 14px 17px;
  border-radius: 14px;
  margin: 12px 0;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #2858a8;
  margin-left: auto;
}

.bot {
  background: #252d3b;
  margin-right: auto;
}

#form {
  display: flex;
  gap: 10px;
  padding: 15px;
  max-width: 850px;
  width: 100%;
  margin: auto;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #424c60;
  background: #202735;
  color: white;
  font-size: 16px;
}

button {
  padding: 0 22px;
  border: none;
  border-radius: 12px;
  background: #3979dc;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

footer {
  text-align: center;
  color: #8993a5;
  font-size: 12px;
  padding: 12px;
}
</style>
</head>

<body>

<header>
  🧠 NeuroAI
  <div style="font-size:13px;font-weight:normal;margin-top:5px">
    Powered by Gemma 4
  </div>
</header>

<div id="chat">
  <div class="message bot">
    Здравствуйте! Я NeuroAI на базе Gemma 4.
    Чем могу помочь?
  </div>
</div>

<form id="form">
  <input
    id="input"
    placeholder="Напишите сообщение..."
    autocomplete="off"
  >
  <button id="send" type="submit">➤</button>
</form>

<footer>
  NeuroAI · Искусственный интеллект Gemma
</footer>

<script>
const API =
  "https://alex-thinkcentre-m92p.tail52eea9.ts.net";

const MODEL = "Librellama/gemma4:e2b-Uncensored";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

const messages = [
  {
    role: "system",
    content:
      "Ты NeuroAI — умный, дружелюбный и полезный ИИ-помощник. Отвечай на русском языке, подробно и понятно."
  }
];

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const text = input.value.trim();

  if (!text || send.disabled) return;

  addMessage(text, "user");

  input.value = "";
  input.disabled = true;
  send.disabled = true;

  messages.push({
    role: "user",
    content: text
  });

  const waiting = addMessage(
    "Gemma думает...",
    "bot"
  );

  try {
    const response = await fetch(API + "/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages,
        stream: false
      })
    });

    if (!response.ok) {
      throw new Error(
        "Ошибка сервера: " + response.status
      );
    }

    const data = await response.json();

    const answer =
      data.message.content || "Пустой ответ модели.";

    waiting.textContent = answer;

    messages.push({
      role: "assistant",
      content: answer
    });

  } catch (error) {
    waiting.textContent =
      "Не удалось подключиться к Gemma.\n\n" +
      error.message +
      "\n\nПроверьте подключение Tailscale и работу компьютера.";

    messages.pop();
  }

  input.disabled = false;
  send.disabled = false;
  input.focus();
});
</script>

</body>
</html>
